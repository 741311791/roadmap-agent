name: Frontend-Backend Schema Sync

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'backend/app/schemas/**'
      - 'backend/app/api/**'
      - 'backend/app/models/**'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'backend/app/schemas/**'
      - 'backend/app/api/**'
      - 'backend/app/models/**'
  workflow_dispatch:  # 允许手动触发

jobs:
  detect-schema-changes:
    name: Detect Schema Changes
    runs-on: ubuntu-latest
    
    outputs:
      has-changes: ${{ steps.check-changes.outputs.has-changes }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史以便比对
      
      - name: Check Schema Changes
        id: check-changes
        run: |
          # 检查是否有 schema 相关文件变更
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E '(schemas|api|models)/'; then
            echo "has-changes=true" >> $GITHUB_OUTPUT
            echo "✅ Detected schema changes"
          else
            echo "has-changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No schema changes detected"
          fi
  
  sync-frontend-types:
    name: Sync Frontend Types
    runs-on: ubuntu-latest
    needs: detect-schema-changes
    if: needs.detect-schema-changes.outputs.has-changes == 'true'
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roadmap_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-next/package-lock.json
      
      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          pip install uv
          uv sync
      
      - name: Start Backend Server
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/roadmap_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test' }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY || 'tvly-test' }}
        run: |
          # 运行数据库迁移
          uv run alembic upgrade head
          
          # 启动后端服务
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          
          # 等待服务启动
          timeout 30 bash -c 'until curl -f http://localhost:8000/health; do sleep 1; done'
          
          echo "✅ Backend server started"
      
      - name: Install Frontend Dependencies
        working-directory: frontend-next
        run: npm ci
      
      - name: Generate Frontend Types
        working-directory: frontend-next
        env:
          OPENAPI_SCHEMA_URL: http://localhost:8000/openapi.json
        run: |
          npm run generate:types
          echo "✅ Frontend types generated"
      
      - name: Validate Generated Types
        working-directory: frontend-next
        run: |
          npm run type-check
          echo "✅ Type validation passed"
      
      - name: Check for Changes
        id: git-check
        run: |
          git diff --exit-code frontend-next/types/generated/ || echo "changes=true" >> $GITHUB_OUTPUT
      
      - name: Commit and Push Changes
        if: steps.git-check.outputs.changes == 'true' && github.event_name == 'push'
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add frontend-next/types/generated/
          git add frontend-next/.openapi-cache.json
          git commit -m "chore: 自动同步前端类型定义"
          git push
      
      - name: Create PR Comment
        if: steps.git-check.outputs.changes == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Schema 变更检测**\n\n检测到后端 Schema 变更，前端类型需要更新。请在合并前运行 `npm run generate:types` 更新前端类型定义。'
            })
      
      - name: Upload Generation Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-report
          path: |
            frontend-next/.sync-report.md
            frontend-next/types/generated/.generation-stats.json
          retention-days: 7

  validate-api-compatibility:
    name: Validate API Compatibility
    runs-on: ubuntu-latest
    needs: detect-schema-changes
    if: needs.detect-schema-changes.outputs.has-changes == 'true'
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      
      - name: Download Previous Schema
        run: |
          # 尝试从 main 分支获取之前的 schema
          git show origin/main:frontend-next/.openapi-cache.json > /tmp/schema-old.json 2>/dev/null || echo "{}" > /tmp/schema-old.json
      
      - name: Compare Schemas
        run: |
          echo "## API Compatibility Report" > /tmp/compatibility-report.md
          echo "" >> /tmp/compatibility-report.md
          
          # 检查是否有 breaking changes
          OLD_ENDPOINTS=$(jq -r '.paths | keys[]' /tmp/schema-old.json 2>/dev/null | sort || echo "")
          NEW_ENDPOINTS=$(jq -r '.paths | keys[]' frontend-next/.openapi-cache.json 2>/dev/null | sort || echo "")
          
          REMOVED=$(comm -23 <(echo "$OLD_ENDPOINTS") <(echo "$NEW_ENDPOINTS"))
          
          if [ -n "$REMOVED" ]; then
            echo "### ⚠️ Breaking Changes Detected" >> /tmp/compatibility-report.md
            echo "" >> /tmp/compatibility-report.md
            echo "The following endpoints have been removed:" >> /tmp/compatibility-report.md
            echo '```' >> /tmp/compatibility-report.md
            echo "$REMOVED" >> /tmp/compatibility-report.md
            echo '```' >> /tmp/compatibility-report.md
            echo "" >> /tmp/compatibility-report.md
            
            echo "❌ Breaking changes detected!"
            exit 1
          else
            echo "### ✅ No Breaking Changes" >> /tmp/compatibility-report.md
            echo "" >> /tmp/compatibility-report.md
            echo "All existing endpoints are preserved." >> /tmp/compatibility-report.md
            echo "✅ API compatibility check passed"
          fi
      
      - name: Upload Compatibility Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-report
          path: /tmp/compatibility-report.md
          retention-days: 7

